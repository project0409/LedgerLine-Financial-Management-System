services:
  mysql:
    image: mysql:8.0
    container_name: ledgerline-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ledgerline_db
      MYSQL_USER: ledger_user
      MYSQL_PASSWORD: ledger_secure_password_replace_me
      MYSQL_ROOT_PASSWORD: root_secure_password_replace_me
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secure_password_replace_me"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    driver: local
